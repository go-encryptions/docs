site_name: go-encryptions
site_description: Pure-Go (standard-library only) encryption primitives — AES-CCM AEAD and the cryptographic core of OpenZFS native dataset encryption. No cgo, no third-party crypto.
site_url: https://go-encryptions.github.io/docs/
repo_url: https://github.com/go-encryptions
repo_name: go-encryptions
edit_uri: ""

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle: { icon: material/weather-sunny, name: Light mode }
  features: [navigation.sections, navigation.top, content.code.copy, search.suggest]

extra_css: [stylesheets/brand.css]
extra:
  version:
    provider: mike

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - md_in_html
  - pymdownx.superfences
  - pymdownx.highlight

nav:
  - Home: index.md
  - Components:
      - Overview: components/index.md
      - "ccm — AES-CCM AEAD": components/ccm.md
      - "zfscrypt — OpenZFS encryption core": components/zfscrypt.md
